<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sbserv-token" content="__TOKEN__">
<title>SBserv</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root{
    --abyss:#06121f; --plate:#0b2033; --plate-2:#0f2a42; --seam:#1c3b5a;
    --cyan:#3fd4ff; --cyan-dim:#1d6f8c; --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;
    --text:#dbe9f6; --muted:#8aa4bd;
    --ui:Bahnschrift,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  }
  html{font-size:16px}
  html.s{font-size:14px} html.l{font-size:18.5px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--abyss);color:var(--text);font:1rem/1.5 var(--ui);min-height:100vh}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .app{display:grid;grid-template-columns:14.5rem 1fr;min-height:100vh}
  .rail{background:linear-gradient(180deg,#081a2b,#06121f);border-right:1px solid var(--seam);padding:1.25rem .9rem;display:flex;flex-direction:column;gap:1.4rem}
  .brand{display:flex;align-items:center;gap:.75rem;padding:0 .4rem}
  .brand img{width:2.75rem;height:2.75rem;border-radius:.6rem;box-shadow:0 0 18px rgba(63,212,255,.35)}
  .brand b{font-size:1.25rem;letter-spacing:.02em}
  .brand small{display:block;color:var(--muted);font-size:.8rem;margin-top:-.15rem}
  nav{display:flex;flex-direction:column;gap:.15rem}
  nav button{background:none;border:0;text-align:left;padding:.65rem .75rem;border-radius:.5rem;color:var(--muted);cursor:pointer;display:flex;gap:.65rem;align-items:center}
  nav button:hover{color:var(--text);background:rgba(63,212,255,.06)}
  nav button[aria-current="page"]{color:var(--text);background:var(--plate-2);box-shadow:inset 3px 0 0 var(--cyan)}
  nav svg{width:1.1rem;height:1.1rem;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
  .rail-foot{margin-top:auto;color:var(--muted);font-size:.8rem}
  main{padding:1.75rem clamp(1rem,3vw,2.5rem) 4rem;max-width:68rem;width:100%}
  h1{font-size:1.75rem;font-weight:600;margin:0 0 .25rem}
  .sub{color:var(--muted);margin:0 0 1.5rem}
  section[hidden]{display:none}
  .plate{background:linear-gradient(180deg,var(--plate-2),var(--plate));border:1px solid var(--seam);border-radius:.9rem}
  .strip{display:grid;grid-template-columns:repeat(3,1fr)}
  .strip>div{padding:1.1rem 1.4rem;border-left:1px solid var(--seam);min-width:0}
  .strip>div:first-child{border-left:0}
  .k{color:var(--muted);font-size:.85rem}
  .pill{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.15rem;margin:.2rem 0}
  .dot{width:.65rem;height:.65rem;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .dot.off{background:#51657a;box-shadow:none}
  .dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
  .mono{font-family:var(--mono);font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
  .beam{margin-top:1.1rem;padding:1.3rem 1.5rem;position:relative;overflow:hidden}
  .beam::before{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:0}
  .beam.live::before{opacity:.85;filter:drop-shadow(0 0 8px var(--cyan))}
  .beam.live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(63,212,255,.12) 50%,transparent 60%);background-size:200% 100%;animation:sweep 5s linear infinite;pointer-events:none}
  @keyframes sweep{from{background-position:-200% 0}to{background-position:200% 0}}
  .beam .row{position:relative;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
  .url{font-family:var(--mono);font-size:clamp(.95rem,2.2vw,1.5rem);color:var(--cyan);background:rgba(6,18,31,.9);padding:.5rem .9rem;border-radius:.5rem;border:1px solid var(--cyan-dim);word-break:break-all}
  .beam:not(.live) .url{color:var(--muted);border-color:var(--seam)}
  .btn{background:var(--plate-2);border:1px solid var(--seam);border-radius:.5rem;padding:.5rem .9rem;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover:not(:disabled){border-color:var(--cyan)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary{background:var(--cyan);color:var(--abyss);border-color:var(--cyan);font-weight:700}
  .btn.stop{border-color:var(--bad);color:var(--bad)}
  .beam p{margin:.8rem 0 0;color:var(--muted);font-size:.9rem;position:relative}
  .beam p.err{color:var(--bad)}
  .two{display:grid;grid-template-columns:1.2fr 1fr;gap:1.1rem;margin-top:1.1rem}
  .pad{padding:1.1rem 1.4rem}
  h2{font-size:1rem;font-weight:600;margin:0 0 .75rem}
  ul.log{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:.82rem}
  ul.log li{display:flex;gap:.75rem;padding:.4rem 0;border-top:1px solid rgba(28,59,90,.6)}
  ul.log li:first-child{border-top:0}
  ul.log time{color:var(--muted);flex:none}
  .actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid rgba(28,59,90,.7);vertical-align:top}
  th{color:var(--muted);font-weight:500}
  td.num{font-family:var(--mono);text-align:right}
  .scroll{overflow-x:auto}
  .tag{font-size:.75rem;border:1px solid var(--seam);border-radius:.4rem;padding:.05rem .5rem;color:var(--muted)}
  .tabs{display:flex;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
  .tabs button{background:none;border:1px solid var(--seam);border-radius:999px;padding:.3rem .9rem;cursor:pointer;color:var(--muted)}
  .tabs button[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:var(--abyss);font-weight:700}
  .field{display:grid;gap:.35rem;margin-bottom:1.1rem;max-width:28rem}
  .field label{color:var(--muted);font-size:.9rem}
  .field input[type=text],.field input[type=password],.field input[type=number],.field select{background:var(--abyss);border:1px solid var(--seam);border-radius:.5rem;padding:.6rem .75rem}
  .field.check{display:flex;gap:.6rem;align-items:center}
  .hint{color:var(--muted);font-size:.85rem}
  .toast{position:fixed;right:1.25rem;bottom:1.25rem;background:var(--plate-2);border:1px solid var(--cyan);border-radius:.6rem;padding:.6rem 1rem;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .offline{position:fixed;inset:0;background:rgba(6,18,31,.92);display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
  .offline.on{display:flex}
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .rail{flex-direction:row;flex-wrap:wrap;align-items:center;padding:.75rem;gap:.6rem}
    .rail-foot{display:none}
    nav{flex-direction:row;flex-wrap:wrap}
    .strip{grid-template-columns:1fr}
    .strip>div{border-left:0;border-top:1px solid var(--seam)}
    .strip>div:first-child{border-top:0}
    .two{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><img src="/logo_512.png" alt="SBserv logo"><div><b>SBserv</b><small data-i="ui_tagline"></small></div></div>
    <nav aria-label="Main">
      <button data-go="dash" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span data-i="nav_dash"></span></button>
      <button data-go="files"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span data-i="nav_files"></span></button>
      <button data-go="db"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span data-i="nav_db"></span></button>
      <button data-go="users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 5a3.5 3.5 0 010 6.5M18 14c2.2.6 3.5 2.6 3.5 6"/></svg><span data-i="nav_users"></span></button>
      <button data-go="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span data-i="nav_settings"></span></button>
    </nav>
    <div class="rail-foot">SBserv v<span id="ver"></span></div>
  </aside>

  <main>
    <section id="dash">
      <h1 data-i="nav_dash"></h1>
      <p class="sub" data-i="ui_dash_sub"></p>
      <div class="plate strip">
        <div><span class="k" data-i="st_web"></span><br><span class="pill"><i class="dot" id="d-web"></i><span id="t-web"></span></span><br><span class="mono" id="m-web"></span></div>
        <div><span class="k" data-i="st_db"></span><br><span class="pill"><i class="dot" id="d-db"></i><span id="t-db"></span></span><br><span class="mono" id="m-db"></span></div>
        <div><span class="k" data-i="st_uptime"></span><br><span class="pill" id="uptime">--:--:--</span></div>
      </div>

      <div class="plate beam" id="beam">
        <h2 data-i="public_link"></h2>
        <div class="row">
          <span class="url" id="url"></span>
          <button class="btn" id="copy" data-i="copy_link"></button>
          <button class="btn primary" id="toggle"></button>
        </div>
        <p id="beamnote"></p>
      </div>

      <div class="two">
        <div class="plate pad"><h2 data-i="latest_activity"></h2><ul class="log" id="log"></ul></div>
        <div class="plate pad">
          <h2 data-i="your_site"></h2>
          <a class="mono" id="sitelink" target="_blank" rel="noopener"></a>
          <p class="hint" data-i="site_hint"></p>
          <div class="actions"><a class="btn primary" id="opensite" target="_blank" rel="noopener" data-i="open_site"></a><button class="btn" id="openfolder" data-i="open_folder"></button></div>
        </div>
      </div>
    </section>

    <section id="files" hidden>
      <h1 data-i="files_title"></h1>
      <p class="sub" data-i="files_sub"></p>
      <div class="plate pad">
        <div class="scroll"><table><thead><tr><th data-i="col_file"></th><th data-i="col_type"></th><th style="text-align:right" data-i="col_size"></th><th></th></tr></thead><tbody id="filebody"></tbody></table></div>
        <p class="hint" id="fileempty" hidden data-i="files_empty"></p>
        <div class="actions"><button class="btn" id="openfolder2" data-i="open_folder"></button></div>
      </div>
    </section>

    <section id="db" hidden>
      <h1 data-i="db_title"></h1>
      <p class="sub" data-i="db_sub"></p>
      <div class="plate pad">
        <div class="tabs" id="tabs"></div>
        <div class="scroll"><table id="dbtable"></table></div>
        <p class="hint" id="dbnote"></p>
      </div>
    </section>

    <section id="users" hidden>
      <h1 data-i="users_title"></h1>
      <p class="sub" data-i="users_sub"></p>
      <div class="plate pad">
        <div class="scroll"><table><thead><tr><th data-i="col_user"></th><th data-i="col_status"></th><th data-i="col_created"></th><th data-i="col_last_login"></th><th></th></tr></thead><tbody id="userbody"></tbody></table></div>
        <p class="hint" id="userempty" hidden data-i="users_empty"></p>
      </div>
      <div class="plate pad" style="margin-top:1rem">
        <div class="field"><label for="u-name" data-i="user_username"></label><input type="text" id="u-name" maxlength="32" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="u-pass" data-i="user_password"></label><input type="password" id="u-pass" maxlength="128" autocomplete="new-password"></div>
        <div class="actions"><button class="btn primary" id="u-add" data-i="user_add"></button><button class="btn" id="u-setpw" data-i="user_set_pw"></button></div>
        <div class="field check" style="margin-top:1rem"><input type="checkbox" id="u-reg"><label for="u-reg" data-i="user_allow_reg"></label></div>
        <p class="hint" data-i="users_api_hint"></p>
      </div>
    </section>

    <section id="set" hidden>
      <h1 data-i="set_title"></h1>
      <p class="sub">&nbsp;</p>
      <div class="plate pad">
        <div class="field"><label for="s-port" data-i="set_port"></label><input type="number" id="s-port" min="1024" max="65535"><span class="hint" data-i="set_port_hint"></span></div>
        <div class="field"><label for="s-lang" data-i="set_lang"></label><select id="s-lang"></select></div>
        <div class="field"><label for="s-size" data-i="set_size"></label><select id="s-size"><option value="s" data-i="size_s"></option><option value="m" data-i="size_m"></option><option value="l" data-i="size_l"></option></select></div>
        <div class="field check"><input type="checkbox" id="s-open"><label for="s-open" data-i="set_open"></label></div>
        <div class="field"><span class="k" data-i="set_data"></span><span class="mono" id="s-data"></span></div>
        <button class="btn primary" id="s-save" data-i="set_apply"></button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="offline" id="offline"><div><b>SBserv</b><br>Connection lost. Close this window or restart SBserv.</div></div>

<script>
(function(){
  var TOKEN=document.querySelector('meta[name=sbserv-token]').content;
  var S={}, ST=null, curTab=null, fails=0, shownTunnelState=null, uptimeBase=0, uptimeAt=0;
  var $=function(id){return document.getElementById(id);};
  function fmt(k,o){var s=S[k]||k;for(var x in (o||{}))s=s.replace('{'+x+'}',o[x]);return s;}
  function api(path,method,body){
    return fetch(path,{method:method||'GET',headers:{'X-SBserv-Token':TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().then(function(j){j._http=r.status;return j;});});
  }
  function toast(m){var e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show');},1800);}
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function size(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';}
  function pad(n){return String(n).padStart(2,'0');}

  function applyStrings(){
    document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=S[el.getAttribute('data-i')]||el.getAttribute('data-i');});
    if(ST)render();
  }
  function loadStrings(){return api('/api/strings').then(function(j){S=j;applyStrings();});}

  /* navigation */
  document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('nav button').forEach(function(o){o.removeAttribute('aria-current');});
    b.setAttribute('aria-current','page');
    document.querySelectorAll('main section').forEach(function(s){s.hidden=s.id!==b.dataset.go;});
    if(b.dataset.go==='files')loadFiles();
    if(b.dataset.go==='db')loadDb();
    if(b.dataset.go==='users')loadUsers();
  };});

  /* status rendering */
  function render(){
    var w=ST.web,d=ST.db,t=ST.tunnel;
    $('ver').textContent=ST.version;
    $('d-web').className='dot'+(w.online?'':' bad');$('t-web').textContent=w.online?S.st_online:S.st_offline;$('m-web').textContent=w.url;
    $('d-db').className='dot'+(d.online?'':' bad');$('t-db').textContent=d.online?S.st_online:S.st_offline;
    $('m-db').textContent=d.name+' · '+size(d.size)+' · '+fmt('st_tables',{n:d.tables});
    var beam=$('beam'),tg=$('toggle');
    beam.classList.toggle('live',t.state==='live');
    $('url').textContent=t.state==='live'?t.url:S.no_link;
    $('copy').disabled=t.state!=='live';
    if(t.state==='live'){tg.textContent=S.stop_tunnel;tg.className='btn stop';tg.disabled=false;}
    else if(t.state==='starting'){tg.textContent=S.tunnel_starting_ui;tg.className='btn primary';tg.disabled=true;}
    else{tg.textContent=S.start_tunnel;tg.className='btn primary';tg.disabled=false;}
    var note=$('beamnote');
    if(t.state==='off'&&t.error){note.className='err';note.textContent=S['err_'+t.error]||t.error;}
    else{note.className='';note.textContent=t.state==='live'?S.tunnel_note_on:S.tunnel_note_off;}
    $('sitelink').textContent=w.url;$('sitelink').href=w.url;$('opensite').href=w.url;
    document.documentElement.className=ST.ui_size==='s'?'s':ST.ui_size==='l'?'l':'';
    document.documentElement.lang=ST.language;
  }
  function tick(){
    if(!ST)return;var s=uptimeBase+Math.floor((Date.now()-uptimeAt)/1000);
    $('uptime').textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
  }
  setInterval(tick,1000);

  function poll(){
    api('/api/status').then(function(j){
      fails=0;$('offline').classList.remove('on');
      var langChanged=ST&&ST.language!==j.language;
      ST=j;uptimeBase=j.uptime;uptimeAt=Date.now();
      if(langChanged)loadStrings();else render();
      if(!shownTunnelState||shownTunnelState!==j.tunnel.state){shownTunnelState=j.tunnel.state;loadLog();}
    }).catch(function(){if(++fails>=3)$('offline').classList.add('on');});
  }
  function loadLog(){
    api('/api/logs').then(function(rows){
      $('log').innerHTML=rows.map(function(r){return '<li><time>'+esc((r.at||'').slice(11,16))+'</time><span>'+esc(r.message)+'</span></li>';}).join('');
    }).catch(function(){});
  }

  /* tunnel + folder */
  $('toggle').onclick=function(){
    var live=ST&&ST.tunnel.state==='live';
    $('toggle').disabled=true;
    api(live?'/api/tunnel/stop':'/api/tunnel/start','POST',{}).then(poll);
  };
  $('copy').onclick=function(){
    var u=ST&&ST.tunnel.url;if(!u)return;
    var done=function(){toast(S.copied);};
    if(navigator.clipboard)navigator.clipboard.writeText(u).then(done,done);else done();
  };
  function openFolder(){api('/api/open-folder','POST',{});}
  $('openfolder').onclick=openFolder;$('openfolder2').onclick=openFolder;

  /* files */
  function loadFiles(){
    api('/api/files').then(function(rows){
      $('filebody').innerHTML=rows.map(function(f){
        var href=ST.web.url+'/'+encodeURIComponent(f.name)+(f.dir?'/':'');
        var ext=f.dir?S.type_folder:(f.name.split('.').pop()||'').toUpperCase();
        return '<tr><td>'+esc(f.name)+(f.dir?'/':'')+'</td><td><span class="tag">'+esc(ext)+'</span></td><td class="num">'+(f.dir?fmt('n_items',{n:f.size}):size(f.size))+'</td><td><a class="btn" target="_blank" rel="noopener" href="'+href+'">'+esc(S.open)+'</a></td></tr>';
      }).join('');
      $('fileempty').hidden=rows.length>0;
    });
  }

  /* database */
  function loadDb(){
    api('/api/db').then(function(tables){
      $('tabs').innerHTML=tables.map(function(n){return '<button aria-pressed="'+(n===curTab)+'" data-t="'+esc(n)+'">'+esc(n)+'</button>';}).join('');
      if(!curTab||tables.indexOf(curTab)<0)curTab=tables[0]||null;
      document.querySelectorAll('#tabs button').forEach(function(b){
        b.setAttribute('aria-pressed',b.dataset.t===curTab);
        b.onclick=function(){curTab=b.dataset.t;loadDb();};
      });
      if(!curTab){$('dbtable').innerHTML='';return;}
      api('/api/db/'+encodeURIComponent(curTab)).then(function(r){
        if(r.error){return;}
        var h='<thead><tr>'+r.columns.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
        r.rows.forEach(function(row){h+='<tr>'+row.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';});
        $('dbtable').innerHTML=h+'</tbody>';
        $('dbnote').textContent=r.rows.length?fmt('db_showing',{n:r.rows.length}):S.db_empty;
      });
    });
  }

  /* users */
  var USERS=[], armed=null;
  function loadUsers(){
    $('u-reg').checked=!!(ST&&ST.allow_register);
    api('/api/users').then(function(rows){
      USERS=rows;
      $('userbody').innerHTML=rows.map(function(u){
        return '<tr><td>'+esc(u.username)+'</td><td><span class="tag">'+esc(u.disabled?S.user_disabled:S.user_active)+'</span></td><td>'+esc(u.created||'')+'</td><td>'+esc(u.last_login||S.user_never)+'</td><td style="text-align:right">'
          +'<button class="btn" data-a="dis" data-id="'+u.id+'" data-d="'+(u.disabled?0:1)+'">'+esc(u.disabled?S.user_enable:S.user_disable)+'</button> '
          +'<button class="btn stop" data-a="del" data-id="'+u.id+'">'+esc(S.user_delete)+'</button></td></tr>';
      }).join('');
      $('userempty').hidden=rows.length>0;
      document.querySelectorAll('#userbody button').forEach(function(b){b.onclick=function(){userAction(b);};});
    });
  }
  function userErr(r){var k='user_err_'+r.error;toast(S[k]||'Error');}
  function userAction(b){
    var id=parseInt(b.dataset.id,10);
    if(b.dataset.a==='dis'){api('/api/users/disable','POST',{id:id,disabled:b.dataset.d==='1'}).then(function(r){r.ok?loadUsers():userErr(r);});return;}
    if(armed!==id){armed=id;b.textContent=S.user_confirm;setTimeout(function(){if(armed===id){armed=null;b.textContent=S.user_delete;}},3000);return;}
    armed=null;
    api('/api/users/delete','POST',{id:id}).then(function(r){if(r.ok){toast(S.user_deleted);loadUsers();}else userErr(r);});
  }
  $('u-add').onclick=function(){
    api('/api/users','POST',{username:$('u-name').value.trim(),password:$('u-pass').value}).then(function(r){
      if(r.ok){toast(S.user_added);$('u-pass').value='';loadUsers();}else userErr(r);
    });
  };
  $('u-setpw').onclick=function(){
    var n=$('u-name').value.trim().toLowerCase(),u=USERS.filter(function(x){return x.username.toLowerCase()===n;})[0];
    if(!u){toast(S.user_err_notfound);return;}
    api('/api/users/password','POST',{id:u.id,password:$('u-pass').value}).then(function(r){
      if(r.ok){toast(S.user_pw_changed);$('u-pass').value='';loadUsers();}else userErr(r);
    });
  };
  $('u-reg').onchange=function(){api('/api/settings','POST',{allow_register:$('u-reg').checked}).then(function(r){if(r.ok){toast(S.set_saved);poll();}});};

  /* settings */
  function fillSettings(){
    if(!ST)return;
    $('s-port').value=ST.web.port;$('s-size').value=ST.ui_size;$('s-open').checked=!!ST.open_dashboard;$('s-data').textContent=ST.data_dir;
    $('s-lang').innerHTML=Object.keys(ST.languages).map(function(c){return '<option value="'+esc(c)+'">'+esc(ST.languages[c])+'</option>';}).join('');
    $('s-lang').value=ST.language;
  }
  document.querySelector('[data-go=set]').addEventListener('click',fillSettings);
  $('s-save').onclick=function(){
    api('/api/settings','POST',{port:$('s-port').value,language:$('s-lang').value,ui_size:$('s-size').value,open_dashboard:$('s-open').checked})
      .then(function(r){
        if(r.ok){toast(S.set_saved);poll();}
        else toast(r.error==='port'?S.set_bad_port:'Error');
      });
  };

  loadStrings().then(function(){poll();loadLog();});
  setInterval(poll,2000);
})();
</script>
</body>
</html>
