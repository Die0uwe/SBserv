<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBserv login</title>
<link rel="icon" href="favicon.ico">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071526;color:#e2e8f0;font-family:system-ui,Segoe UI,sans-serif}
  main{width:min(92vw,360px);background:#0d2238;border:1px solid #1e3a5a;border-radius:14px;padding:1.6rem}
  img{width:64px;display:block;margin:0 auto .6rem}
  h1{font-size:1.2rem;text-align:center;margin:.2rem 0 1rem}
  label{display:block;font-size:.85rem;margin:.7rem 0 .2rem}
  input{width:100%;box-sizing:border-box;padding:.6rem;border-radius:8px;border:1px solid #1e3a5a;background:#071526;color:inherit;font:inherit}
  button{margin-top:1rem;width:100%;padding:.65rem;border:0;border-radius:8px;background:#22d3ee;color:#071526;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
  button.alt{background:transparent;color:#22d3ee;border:1px solid #1e3a5a;margin-top:.5rem}
  #msg{min-height:1.4em;margin-top:.8rem;font-size:.9rem;text-align:center}
  .lang{text-align:right;font-size:.8rem}.lang a{color:#22d3ee;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="lang"><a id="en">EN</a> · <a id="nl">NL</a></div>
  <img src="logo_512.png" alt="SBserv">
  <h1 id="title"></h1>
  <form id="f">
    <label for="u" id="lu"></label><input id="u" autocomplete="username" required>
    <label for="p" id="lp"></label><input id="p" type="password" autocomplete="current-password" required>
    <button id="go"></button>
  </form>
  <button class="alt" id="out" hidden></button>
  <div id="msg" role="status"></div>
</main>
<script>
(function(){
  var T={
    en:{title:"Sign in",u:"Username",p:"Password",go:"Sign in",out:"Sign out",hi:"Signed in as ",bad:"Wrong username or password.",many:"Too many attempts. Wait a few minutes.",err:"Something went wrong."},
    nl:{title:"Inloggen",u:"Gebruikersnaam",p:"Wachtwoord",go:"Inloggen",out:"Uitloggen",hi:"Ingelogd als ",bad:"Onjuiste gebruikersnaam of wachtwoord.",many:"Te veel pogingen. Wacht een paar minuten.",err:"Er ging iets mis."}
  };
  var L=(navigator.language||'en').slice(0,2)==='nl'?'nl':'en', $=function(i){return document.getElementById(i);};
  function api(path,body){return fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'}).then(function(r){return r.json();});}
  function text(){var t=T[L];document.documentElement.lang=L;$('title').textContent=t.title;$('lu').textContent=t.u;$('lp').textContent=t.p;$('go').textContent=t.go;$('out').textContent=t.out;}
  function me(){api('/api/auth/me').then(function(r){
    var on=!!r.ok;$('f').hidden=on;$('out').hidden=!on;$('msg').textContent=on?T[L].hi+r.user:'';
  });}
  $('en').onclick=function(){L='en';text();me();};$('nl').onclick=function(){L='nl';text();me();};
  $('f').onsubmit=function(e){
    e.preventDefault();
    api('/api/auth/login',{username:$('u').value,password:$('p').value}).then(function(r){
      $('p').value='';
      if(r.ok)me();else $('msg').textContent=r.error==='too_many_attempts'?T[L].many:T[L].bad;
    }).catch(function(){$('msg').textContent=T[L].err;});
  };
  $('out').onclick=function(){api('/api/auth/logout',{}).then(me);};
  text();me();
})();
</script>
</body>
</html>
